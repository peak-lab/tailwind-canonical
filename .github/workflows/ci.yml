name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      NODE_OPTIONS: ${{ matrix.node == 22 && '--experimental-strip-types' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
        if: matrix.node == 22
      - run: pnpm test:coverage
        if: matrix.node == 24
      - name: Upload coverage for SonarQube
        if: matrix.node == 24
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - run: pnpm build
      - name: Check benchmark corpus and pipeline invariants
        run: |
          node scripts/benchmark.mjs --files 6 --lines 5 --runs 1 --json
          node scripts/benchmark.mjs --corpus helpers --files 6 --lines 5 --runs 1 --json

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - eslint: '8.57.1'
            tailwind-merge: '2.6.1'
          - eslint: '8.57.1'
            tailwind-merge: '3.7.0'
          - eslint: '9.39.5'
            tailwind-merge: '2.6.1'
          - eslint: '9.39.5'
            tailwind-merge: '3.7.0'
          - eslint: '10.13.0'
            tailwind-merge: '2.6.1'
          - eslint: '10.13.0'
            tailwind-merge: '3.7.0'
          - eslint: '8.57.1'
            tailwind-merge: '2.0.0'
          - eslint: '9.0.0'
            tailwind-merge: '3.0.0'
          - eslint: '10.0.0'
            tailwind-merge: '3.0.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compat '${{ matrix.eslint }}' '${{ matrix.tailwind-merge }}'

  css-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:css

  sonarqube:
    name: SonarQube quality gate
    needs: test
    # Community Build supports main-branch analysis only. Never expose the token
    # to PR code; the scanned revision must be the trusted main checkout.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sonarqube-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Analyze and enforce the SonarQube quality gate
        run: pnpm sonar -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

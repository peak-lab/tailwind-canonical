name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # a tag deletion is also a `push` matching `v*`, and would otherwise
    # publish whatever the default branch resolves to
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # authenticated by OIDC via the npm trusted publisher for this repo and
      # workflow filename; renaming this file breaks publishing until npm is
      # updated, since the trust is pinned to `publish.yml`
      - run: pnpm publish --no-git-checks --provenance --access public

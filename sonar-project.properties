sonar.projectKey=tailwind-canonical
sonar.projectName=tailwind-canonical
sonar.sourceEncoding=UTF-8

# Source and tests share src/, but must be indexed separately.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts
sonar.test.inclusions=src/**/*.test.ts
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.test.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
